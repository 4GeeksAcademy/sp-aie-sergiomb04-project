[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trackflow_api"]

[project]
name = "trackflow-services-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "python-multipart==0.0.20",
  "tinydb==4.8.2",
  "sqlmodel==0.0.24",
  "psycopg[binary]==3.2.9",
  "python-dotenv==1.1.1",
  "python-jose[cryptography]==3.5.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "email-validator==2.3.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov>=6.0",
]

[project.scripts]
seed = "trackflow_api.seed:main"
seed-inventory = "trackflow_api.seed_inventory:main"
create-user = "trackflow_api.create_user:main"
create-admin = "trackflow_api.create_admin:main"
