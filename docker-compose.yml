services:
  uis:
    build:
      context: ./uis
      dockerfile: Dockerfile
    container_name: trackflow-uis-dev
    env_file:
      - ./.env
    environment:
      WEBSITE_PORT: ${WEBSITE_PORT}
      BACKOFFICE_PORT: ${BACKOFFICE_PORT}
      TRACKFLOW_API_BASE_URL: ${TRACKFLOW_API_BASE_URL}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL}
    ports:
      - "${WEBSITE_PORT}:${WEBSITE_PORT}"
      - "${BACKOFFICE_PORT}:${BACKOFFICE_PORT}"
    volumes:
      - ./uis:/workspace/uis
      - ./src:/workspace/src
      - ./packages:/workspace/packages
      - ./shared:/workspace/shared
      - uis_website_node_modules:/workspace/uis/website/node_modules
      - uis_website_next:/workspace/uis/website/.next
      - uis_backoffice_node_modules:/workspace/uis/backoffice/node_modules
      - uis_backoffice_next:/workspace/uis/backoffice/.next
    depends_on:
      - services
    networks:
      - trackflow-dev-net

  services:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: trackflow-services-dev
    working_dir: /workspace/services/api
    env_file:
      - ./.env
    environment:
      SERVICES_PORT: ${SERVICES_PORT}
      DATABASE_URL: ${DATABASE_URL}
      TRACKFLOW_DB_PATH: ${TRACKFLOW_DB_PATH}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MCP_SERVER_URL: http://mcp:8001
      PYTHONPATH: /workspace
    ports:
      - "${SERVICES_PORT}:${SERVICES_PORT}"
    volumes:
      - ./services:/workspace/services
      - ./mcps:/workspace/mcps
      - ./docs:/workspace/docs
      - ./scripts:/workspace/scripts
      - ./data:/workspace/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trackflow-dev-net

  mcp:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: trackflow-mcp-dev
    working_dir: /workspace
    command: ["sh", "-c", "uvicorn mcps.trackflow_mcp.server:app --reload --host 0.0.0.0 --port ${MCP_PORT:-8001}"]
    env_file:
      - ./.env
    environment:
      MCP_PORT: ${MCP_PORT:-8001}
      PORT: ${MCP_PORT:-8001}
      HOST: "0.0.0.0"
      TRACKFLOW_INCIDENTS_DB_PATH: /workspace/services/api/trackflow_api/data/incidents.json
      TRACKFLOW_DB_PATH: /workspace/services/api/trackflow_api/data/db.json
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: /workspace
    ports:
      - "${MCP_PORT:-8001}:${MCP_PORT:-8001}"
    volumes:
      - ./services:/workspace/services
      - ./mcps:/workspace/mcps
      - ./docs:/workspace/docs
      - ./scripts:/workspace/scripts
      - ./data:/workspace/data
    networks:
      - trackflow-dev-net

  redis:
    image: redis:alpine
    container_name: trackflow-redis-dev
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trackflow-dev-net

  worker:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: trackflow-worker-dev
    working_dir: /workspace/services/api
    command: ["celery", "-A", "trackflow_api.celery_app", "worker", "--loglevel=info"]
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TRACKFLOW_DB_PATH: ${TRACKFLOW_DB_PATH}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      PYTHONPATH: /workspace
    volumes:
      - ./services:/workspace/services
      - ./mcps:/workspace/mcps
      - ./docs:/workspace/docs
      - ./scripts:/workspace/scripts
      - ./data:/workspace/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trackflow-dev-net

  flower:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: trackflow-flower-dev
    working_dir: /workspace/services/api
    command: ["celery", "-A", "trackflow_api.celery_app", "flower", "--port=5555", "--broker=redis://redis:6379/0"]
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /workspace
    ports:
      - "5555:5555"
    volumes:
      - ./services:/workspace/services
      - ./mcps:/workspace/mcps
      - ./docs:/workspace/docs
      - ./scripts:/workspace/scripts
      - ./data:/workspace/data
    depends_on:
      redis:
        condition: service_healthy
  qdrant:
    image: qdrant/qdrant:latest
    container_name: trackflow-qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage:z
    networks:
      - trackflow-dev-net

networks:
  trackflow-dev-net:
    name: trackflow-dev-net
    driver: bridge

volumes:
  uis_website_node_modules:
  uis_website_next:
  uis_backoffice_node_modules:
  uis_backoffice_next:
  qdrant_storage:
